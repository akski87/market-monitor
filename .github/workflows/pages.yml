name: Deploy to GitHub Pages

# Serve the repository root as a static site (index.html + markets/<slug>/site/...).
# The daily-pull job commits with GITHUB_TOKEN, and GitHub does NOT trigger workflows
# from GITHUB_TOKEN pushes — so a plain `push` trigger misses every daily data commit
# (the live site froze while the repo kept updating). We therefore also deploy on
# `workflow_run` after "Daily availability pull" completes, which fires regardless.

on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["Daily availability pull"]
    types: [completed]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
      - name: Upload the repo root as the Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
